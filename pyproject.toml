[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc2-fast-sim"
version = "0.1.0"
description = "High-performance SC2 simulator (ECS + numpy SoA)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
jit  = ["numba>=0.57"]   # Phase 3 引入

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
